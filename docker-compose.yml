# Virtual Science Park — local demo stack.
# Owner: Backend 1. Cut-list item #1: everything must also run without Docker.
#
#   cp .env.example .env            # fill in model settings
#   docker compose up --build       # api :8000, ui :3000 (pinned Lovable frontend image)
#   docker compose --profile ollama up --build   # also start a local model
#   docker compose run --rm api python -m agents.profiler   # one-off agent run

x-app: &app
  build:
    context: .
    dockerfile: api/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: sqlite:////data/vsp.db
    CACHE_DIR: /data/cache
  volumes:
    - vsp-data:/data          # SQLite DB + cached pages/agent output
    - ./fixtures:/app/fixtures:ro

services:
  api:
    <<: *app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Frontend (TypeScript/React built with Lovable), published as a pinned image
  # from https://github.com/adCBueno/virtual-blue-science-park.
  # Its build-time settings are baked into the image; it listens on 3000.
  ui:
    image: adcbueno1/virtual-science-park:1.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Optional local model (MODEL_RUNTIME=ollama). Start with --profile ollama.
  ollama:
    image: ollama/ollama:0.12.3
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  vsp-data:
  ollama-models:
